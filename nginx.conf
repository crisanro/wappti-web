server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1. PROXY SEGURO PARA REVIEWS (Añade la llave del .env aquí)
    location /api-reviews/ {
        # Esto obliga a Nginx a buscar la IP de core.wappti.app usando el DNS de Google
        resolver 8.8.8.8 valid=30s;
        set $backend_endpoint "http://core.wappti.app/api/v1/marketing/latest-reviews";

        proxy_pass $backend_endpoint;

        # IMPORTANTE: Asegúrate de que este nombre sea EXACTAMENTE 
        # igual al que espera FastAPI (x_wappti_key)
        proxy_set_header X-Wappti-Key "Wappti_Secure_7722_XyZ_2026";
        
        proxy_set_header Host core.wappti.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Esto elimina cualquier intento del usuario de suplantar la llave
        proxy_set_header X-Wappti-Key "Wappti_Secure_7722_XyZ_2026";
        
        proxy_buffering off;
        proxy_ssl_server_name on; # Por si core.wappti.app usa SSL después
    }
    
    # URLs limpias: /consultar?id=... → consultar.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Cache archivos estáticos
    location ~* \.(css|js|ico|png|jpg|webp|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
}


