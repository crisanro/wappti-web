server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1. PROXY SEGURO PARA REVIEWS (Añade la llave del .env aquí)
    location /api-reviews/ {
        # Redirige a la URL real de tu API
        proxy_pass http://core.wappti.app/api/v1/marketing/latest-reviews;
        
        # Inyecta la llave secreta que definiste en tu .env de FastAPI
        # Nginx la añade internamente; el usuario nunca la ve.
        proxy_set_header X-Wappti-Key "Wappti_Secure_7722_XyZ_2026";
        
        # Headers necesarios para que la API no se pierda
        proxy_set_header Host core.wappti.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Evita problemas de buffer en respuestas pequeñas
        proxy_buffering off;
    }

    # URLs limpias: /consultar?id=... → consultar.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Cache archivos estáticos
    location ~* \.(css|js|ico|png|jpg|webp|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
}
