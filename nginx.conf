server {
    underscores_in_headers on;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1. PROXY SEGURO PARA REVIEWS
    location /api-reviews/ {
        resolver 8.8.8.8 valid=30s;
        set $backend_endpoint "https://core.wappti.app/api/v1/marketing/latest-reviews";
        proxy_pass $backend_endpoint;
        proxy_set_header X-Wappti-Key "Wappti_Secure_7722_XyZ_2026";
        proxy_set_header Host core.wappti.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_ssl_server_name on;
    }
    
    # MODIFICACIÓN AQUÍ: Manejo de URLs limpias e index
    location / {
        # Esto permite que:
        # 1. $uri -> busque el archivo exacto
        # 2. $uri/ -> busque si es una carpeta y cargue el index.html
        # 3. $uri.html -> busque el archivo .html (ej: /index -> /index.html)
        try_files $uri $uri/ $uri.html =404;
    }

    # Redirección opcional: Si quieres que /index/ (con slash) no de error
    # y cargue el index.html interno
    location = /index/ {
        return 301 /index;
    }

    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Cache archivos estáticos
    location ~* \.(css|js|ico|png|jpg|webp|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
}
